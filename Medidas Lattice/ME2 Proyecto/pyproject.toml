[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medidor-lc-utn"
version = "0.1.0"
description = "Medidor de impedancia serie L/C para osciloscopios UNI-T UTD2000CEX+"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
usb = [
  "PyVISA>=1.14,<2",
  "PyVISA-py>=0.7,<1",
  "PyUSB>=1.2,<2",
]

[project.scripts]
medidor-lc = "medidor_lc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

